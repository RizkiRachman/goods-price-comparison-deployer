# Task: Docker Build and Push using Kaniko
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: docker-build
  namespace: ${PIPELINE_NAMESPACE}
spec:
  workspaces:
    - name: output
  params:
    - name: IMAGE
      type: string
      description: "Full image name including registry (e.g., registry.example.com/myimage:tag)"
    - name: DOCKERFILE
      type: string
      default: "./Dockerfile"
    - name: CONTEXT
      type: string
      default: "."
    - name: REGISTRY_MIRROR
      type: string
      default: "${REGISTRY_CLUSTER_HOST}:${REGISTRY_CLUSTER_PORT}"
      description: "Local registry mirror to try before Docker Hub (avoids IPv6 routing issues)"
  steps:
    - name: build-and-push
      image: ${KANIKO_IMAGE}
      workingDir: $(workspaces.output.path)
      env:
        - name: DOCKER_CONFIG
          value: /tekton/home/.docker
      command:
        - /kaniko/executor
      args:
        - --dockerfile=$(params.DOCKERFILE)
        - --context=$(params.CONTEXT)
        - --destination=$(params.IMAGE)
        - --registry-mirror=$(params.REGISTRY_MIRROR)
        - --skip-tls-verify
        - --insecure
        - --insecure-pull
        - --cache=true
