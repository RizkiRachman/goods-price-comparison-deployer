# Task: Database Migration using Flyway (via Maven)
# Reads credentials from Vault and runs mvn flyway:migrate
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: db-migrate
  namespace: ${PIPELINE_NAMESPACE}
spec:
  workspaces:
    - name: source
    - name: maven-settings
      optional: true
  params:
    - name: COMPONENT_NAME
      type: string
      default: "${COMPONENT_NAME}"
    - name: VAULT_ADDRESS_PIPELINE
      type: string
      default: "${VAULT_ADDRESS_PIPELINE}"
    - name: COMPONENT_MOUNT
      type: string
      default: "${COMPONENT_MOUNT}"
    - name: POSTGRES_HOST
      type: string
      default: "${POSTGRES_HOST}"
    - name: POSTGRES_PORT
      type: string
      default: "${POSTGRES_PORT}"
    - name: DATABASE_HOST
      type: string
      default: ""
      description: "External DB host. Falls back to POSTGRES_HOST if empty."
    - name: DATABASE_PORT
      type: string
      default: ""
      description: "External DB port. Falls back to POSTGRES_PORT if empty."
    - name: MAVEN_IMAGE
      type: string
      default: "${MAVEN_IMAGE}"
  volumes:
    - name: vault-token
      secret:
        secretName: vault-token
        optional: true
    - name: maven-settings
      secret:
        secretName: maven-settings-secret
    - name: maven-cache
      persistentVolumeClaim:
        claimName: maven-cache-pvc
  steps:
    - name: migrate
      image: $(params.MAVEN_IMAGE)
      workingDir: $(workspaces.source.path)
      volumeMounts:
        - name: vault-token
          mountPath: /var/run/secrets/vault
          readOnly: true
        - name: maven-settings
          mountPath: /root/.m2/settings.xml
          subPath: settings.xml
        - name: maven-cache
          mountPath: /root/.m2/repository
      env:
        - name: COMPONENT_NAME
          value: $(params.COMPONENT_NAME)
        - name: VAULT_ADDRESS_PIPELINE
          value: $(params.VAULT_ADDRESS_PIPELINE)
        - name: VAULT_TOKEN
          valueFrom:
            secretKeyRef:
              name: vault-token
              key: token
              optional: true
        - name: COMPONENT_MOUNT
          value: $(params.COMPONENT_MOUNT)
        - name: POSTGRES_HOST
          value: $(params.POSTGRES_HOST)
        - name: POSTGRES_PORT
          value: $(params.POSTGRES_PORT)
        - name: DATABASE_HOST
          value: $(params.DATABASE_HOST)
        - name: DATABASE_PORT
          value: $(params.DATABASE_PORT)
      script: |
        #!/bin/bash
        set -e

        # Install jq
        apt-get update -qq && apt-get install -y -qq jq curl

        # Resolve database host: prefer DATABASE_HOST if set, fall back to POSTGRES_HOST
        DB_HOST="${DATABASE_HOST:-${POSTGRES_HOST}}"
        DB_PORT="${DATABASE_PORT:-${POSTGRES_PORT}}"

        echo "🗄️ Running database migrations..."
        echo "   Component: ${COMPONENT_NAME}"
        echo "   Vault: ${VAULT_ADDRESS_PIPELINE}"
        echo "   Database Host: ${DB_HOST}:${DB_PORT} (source: ${DATABASE_HOST:+external}${DATABASE_HOST:-local})"

        # Verify Vault connectivity
        echo "🔍 Verifying Vault connectivity..."
        VAULT_HEALTH_URL="${VAULT_ADDRESS_PIPELINE}/v1/sys/health"
        VAULT_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "${VAULT_HEALTH_URL}" 2>/dev/null)
        case "$VAULT_HEALTH" in 200|429|472|473)
            echo "✅ Vault is reachable at ${VAULT_ADDRESS_PIPELINE}" ;;
        *)
            echo "❌ Vault is not reachable at ${VAULT_ADDRESS_PIPELINE} (HTTP ${VAULT_HEALTH:-000})"
            exit 1 ;;
        esac

        # Verify Vault token
        TOKEN_LOOKUP=$(curl -s -H "X-Vault-Token: ${VAULT_TOKEN}" \
            "${VAULT_ADDRESS_PIPELINE}/v1/auth/token/lookup-self" 2>/dev/null)
        if echo "$TOKEN_LOOKUP" | grep -q '"errors"'; then
            echo "❌ Invalid or expired Vault token"
            exit 1
        fi
        echo "✅ Vault token is valid"

        # Read database credentials from Vault
        echo "Reading database credentials from Vault..."
        VAULT_RESPONSE=$(curl -s -H "X-Vault-Token: ${VAULT_TOKEN}" \
            "${VAULT_ADDRESS_PIPELINE}/v1/${COMPONENT_MOUNT}/data/${COMPONENT_NAME}")

        if echo "$VAULT_RESPONSE" | grep -q '"errors"' || [ -z "$VAULT_RESPONSE" ]; then
            echo "❌ Failed to read credentials from Vault: ${COMPONENT_MOUNT}/${COMPONENT_NAME}"
            echo "   Response: $VAULT_RESPONSE"
            exit 1
        fi

        DB_NAME=$(echo "$VAULT_RESPONSE" | jq -r '.data.data."database_name"')
        DB_USER=$(echo "$VAULT_RESPONSE" | jq -r '.data.data."database_username"')
        DB_PASS=$(echo "$VAULT_RESPONSE" | jq -r '.data.data."database_password"')

        echo "Database: ${DB_NAME}"
        echo "User: ${DB_USER}"
        # Mask password for logging
        PASS_LEN=${#DB_PASS}
        if [ "$PASS_LEN" -gt 4 ]; then
            PASS_PREFIX=$(echo "$DB_PASS" | cut -c1-2)
            PASS_SUFFIX=$(echo "$DB_PASS" | cut -c$((PASS_LEN-1))-$PASS_LEN)
            echo "Password: ${PASS_PREFIX}****${PASS_SUFFIX} (${PASS_LEN} chars)"
        else
            echo "Password: ****"
        fi
        echo "JDBC URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}"

        # Run Maven Flyway migration via flyway profile
        echo "Executing: mvn flyway:migrate -Pflyway ..."
        mvn flyway:migrate -Pflyway \
            -DDATABASE_HOST="${DB_HOST}" \
            -DDATABASE_PORT="${DB_PORT}" \
            -DDATABASE_NAME="${DB_NAME}" \
            -DDATABASE_USERNAME="${DB_USER}" \
            -DDATABASE_PASSWORD="${DB_PASS}" \
            -q

        echo "✅ Database migration completed successfully!"

    - name: verify
      image: $(params.MAVEN_IMAGE)
      workingDir: $(workspaces.source.path)
      volumeMounts:
        - name: vault-token
          mountPath: /var/run/secrets/vault
          readOnly: true
        - name: maven-settings
          mountPath: /root/.m2/settings.xml
          subPath: settings.xml
        - name: maven-cache
          mountPath: /root/.m2/repository
      env:
        - name: COMPONENT_NAME
          value: $(params.COMPONENT_NAME)
        - name: VAULT_ADDRESS_PIPELINE
          value: $(params.VAULT_ADDRESS_PIPELINE)
        - name: VAULT_TOKEN
          valueFrom:
            secretKeyRef:
              name: vault-token
              key: token
              optional: true
        - name: COMPONENT_MOUNT
          value: $(params.COMPONENT_MOUNT)
        - name: POSTGRES_HOST
          value: $(params.POSTGRES_HOST)
        - name: POSTGRES_PORT
          value: $(params.POSTGRES_PORT)
        - name: DATABASE_HOST
          value: $(params.DATABASE_HOST)
        - name: DATABASE_PORT
          value: $(params.DATABASE_PORT)
      script: |
        #!/bin/bash
        set -e

        apt-get update -qq && apt-get install -y -qq jq curl

        # Resolve database host: prefer DATABASE_HOST if set, fall back to POSTGRES_HOST
        DB_HOST="${DATABASE_HOST:-${POSTGRES_HOST}}"
        DB_PORT="${DATABASE_PORT:-${POSTGRES_PORT}}"

        echo "🔍 Verifying migration status..."

        # Verify Vault connectivity
        VAULT_HEALTH_URL="${VAULT_ADDRESS_PIPELINE}/v1/sys/health"
        VAULT_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "${VAULT_HEALTH_URL}" 2>/dev/null)
        case "$VAULT_HEALTH" in 200|429|472|473)
            echo "✅ Vault is reachable" ;;
        *)
            echo "❌ Vault is not reachable (HTTP ${VAULT_HEALTH:-000})"
            exit 1 ;;
        esac

        # Read credentials again
        VAULT_RESPONSE=$(curl -s -H "X-Vault-Token: ${VAULT_TOKEN}" \
            "${VAULT_ADDRESS_PIPELINE}/v1/${COMPONENT_MOUNT}/data/${COMPONENT_NAME}")

        DB_NAME=$(echo "$VAULT_RESPONSE" | jq -r '.data.data."database_name"')
        DB_USER=$(echo "$VAULT_RESPONSE" | jq -r '.data.data."database_username"')
        DB_PASS=$(echo "$VAULT_RESPONSE" | jq -r '.data.data."database_password"')

        # Mask password for logging
        PASS_LEN=${#DB_PASS}
        if [ "$PASS_LEN" -gt 4 ]; then
            PASS_PREFIX=$(echo "$DB_PASS" | cut -c1-2)
            PASS_SUFFIX=$(echo "$DB_PASS" | cut -c$((PASS_LEN-1))-$PASS_LEN)
            PASS_MASKED="${PASS_PREFIX}****${PASS_SUFFIX}"
        else
            PASS_MASKED="****"
        fi
        echo "   Database: ${DB_NAME}"
        echo "   User: ${DB_USER}"
        echo "   Password: ${PASS_MASKED} (${PASS_LEN} chars)"
        echo "   JDBC URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}"

        # Validate password is not empty
        if [ -z "${DB_PASS}" ] || [ "${DB_PASS}" = "null" ]; then
            echo "❌ Database password is empty or null in Vault"
            exit 1
        fi

        # Run flyway info to verify
        mvn flyway:info -Pflyway \
            -DDATABASE_HOST="${DB_HOST}" \
            -DDATABASE_PORT="${DB_PORT}" \
            -DDATABASE_NAME="${DB_NAME}" \
            -DDATABASE_USERNAME="${DB_USER}" \
            -DDATABASE_PASSWORD="${DB_PASS}" \
            -q

    
