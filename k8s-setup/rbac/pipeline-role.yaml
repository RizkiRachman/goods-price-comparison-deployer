# Role: scoped permissions for the pipeline SA inside PIPELINE_NAMESPACE.
# Covers Tekton resources, PVCs, pods, secrets (service-specific), configmaps, services.
# Does NOT touch shared infrastructure secrets (registry-credentials, gcr-key).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${DEPLOYMENT_NAME}-role
  namespace: ${PIPELINE_NAMESPACE}
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["tasks", "taskruns", "pipelines", "pipelineruns"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["github-maven-credentials", "maven-settings-secret"]
    verbs: ["get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
