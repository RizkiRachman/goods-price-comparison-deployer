# RoleBinding: pipeline SA (in PIPELINE_NAMESPACE) → deployer-role inside DEPLOYMENT_NAMESPACE.
# Cross-namespace binding required because deploy/config-apply tasks kubectl-apply
# resources into DEPLOYMENT_NAMESPACE while running under the pipeline SA.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${DEPLOYMENT_NAME}-deployer-binding
  namespace: ${DEPLOYMENT_NAMESPACE}
subjects:
- kind: ServiceAccount
  name: ${PIPELINE_SERVICE_ACCOUNT}
  namespace: ${PIPELINE_NAMESPACE}
roleRef:
  kind: Role
  name: ${DEPLOYMENT_NAME}-deployer-role
  apiGroup: rbac.authorization.k8s.io
