# PipelineRun: Execute the goods-price-service pipeline
# pipeline-mode: "full" (all tasks) or "plan" (build+test only)
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: ${DEPLOYMENT_NAME}-
  namespace: ${PIPELINE_NAMESPACE}
spec:
  taskRunTemplate:
    serviceAccountName: tekton-sa
  pipelineRef:
    name: ${DEPLOYMENT_NAME}-pipeline
  workspaces:
    - name: shared-workspace
      persistentVolumeClaim:
        claimName: ${DEPLOYMENT_NAME}-pvc
  params:
    - name: git-url
      value: "${GIT_REPO_URL}"
    - name: git-revision
      value: "${GIT_REPO_DEFAULT_BRANCH}"
    - name: image-name
      value: "${IMAGE_NAME}"
    - name: image-tag
      value: "${IMAGE_TAG}"
    - name: registry-host
      value: "${REGISTRY_CLUSTER_HOST}"
    - name: registry-port
      value: "${REGISTRY_CLUSTER_PORT}"
    - name: test-goals
      value: "test"
    - name: deployment-namespace
      value: "${DEPLOYMENT_NAMESPACE}"
    - name: deployment-name
      value: "${DEPLOYMENT_NAME}"
    - name: pipeline-mode
      value: "${PIPELINE_MODE}"
    - name: pipeline-namespace
      value: "${PIPELINE_NAMESPACE}"
    - name: deployment-port
      value: "${DEPLOYMENT_PORT}"
    # Database provisioning and migration parameters
    - name: vault-address-pipeline
      value: "${VAULT_ADDRESS_PIPELINE}"
    - name: component-name
      value: "${COMPONENT_NAME}"
    - name: postgres-host
      value: "${POSTGRES_HOST}"
    - name: postgres-port
      value: "${POSTGRES_PORT}"
    - name: infra-db-mount
      value: "${INFRA_DB_MOUNT}"
    - name: component-mount
      value: "${COMPONENT_MOUNT}"
    - name: migrations-path
      value: "${MIGRATIONS_PATH}"
