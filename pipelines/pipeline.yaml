# Pipeline: Clone → Build → Test → Build Image → DB Migrate → Deploy
# Supports pipeline-mode: "full" (all tasks) or "plan" (build+test only, skip image/deploy)
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: ${DEPLOYMENT_NAME}-pipeline
  namespace: ${PIPELINE_NAMESPACE}
spec:
  workspaces:
    - name: shared-workspace
  params:
    - name: git-url
      type: string
      default: "${GIT_REPO_URL}"
    - name: git-revision
      type: string
      default: "${GIT_REPO_DEFAULT_BRANCH}"
    - name: image-name
      type: string
      default: "${IMAGE_NAME}"
    - name: image-tag
      type: string
      default: "${IMAGE_TAG}"
    - name: registry-host
      type: string
      default: "${REGISTRY_CLUSTER_HOST}"
    - name: registry-port
      type: string
      default: "${REGISTRY_CLUSTER_PORT}"
    - name: test-goals
      type: string
      default: "test"
      description: "Maven test goals: 'test' or 'verify'"
    - name: deployment-namespace
      type: string
      default: "${DEPLOYMENT_NAMESPACE}"
    - name: deployment-name
      type: string
      default: "${DEPLOYMENT_NAME}"
    - name: deployment-port
      type: string
      default: "${DEPLOYMENT_PORT}"
    - name: pipeline-mode
      type: string
      default: "full"
      description: "full = all tasks including deploy, plan = build+test only"
    - name: pipeline-namespace
      type: string
      default: "${PIPELINE_NAMESPACE}"
    - name: kubectl-image
      type: string
      default: "${KUBECTL_IMAGE}"
    # Database provisioning and migration parameters
    - name: vault-address-pipeline
      type: string
      default: "${VAULT_ADDRESS_PIPELINE}"
      description: "Vault address reachable from pods"
    - name: component-name
      type: string
      default: "${COMPONENT_NAME}"
      description: "Component name for Vault path"
    - name: postgres-host
      type: string
      default: "${POSTGRES_HOST}"
      description: "PostgreSQL host service DNS name"
    - name: postgres-port
      type: string
      default: "${POSTGRES_PORT}"
      description: "PostgreSQL port"
    - name: infra-db-mount
      type: string
      default: "${INFRA_DB_MOUNT}"
      description: "Vault mount path for infrastructure DB credentials"
    - name: component-mount
      type: string
      default: "${COMPONENT_MOUNT}"
      description: "Vault mount path for component credentials"
    - name: migrations-path
      type: string
      default: "${MIGRATIONS_PATH}"
      description: "Path to Flyway migrations directory"

  tasks:
    # 0. Cleanup workspace
    - name: cleanup
      taskRef:
        name: cleanup
      workspaces:
        - name: output
          workspace: shared-workspace

    # 1. Clone source code
    - name: clone
      taskRef:
        name: git-clone
      runAfter: [cleanup]
      workspaces:
        - name: output
          workspace: shared-workspace
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)

    # 2. Maven build (skip tests)
    - name: build
      taskRef:
        name: maven-build
      runAfter: [clone]
      workspaces:
        - name: output
          workspace: shared-workspace

    # 3. Maven test
    - name: test
      taskRef:
        name: maven-test
      runAfter: [build]
      workspaces:
        - name: output
          workspace: shared-workspace
      params:
        - name: GOALS
          value: $(params.test-goals)

    # 4. Build and push Docker image (skipped in plan mode)
    - name: build-image
      taskRef:
        name: docker-build
      runAfter: [test]
      when:
        - input: "$(params.pipeline-mode)"
          operator: in
          values: ["full"]
      workspaces:
        - name: output
          workspace: shared-workspace
      params:
        - name: IMAGE
          value: "$(params.registry-host):$(params.registry-port)/$(params.image-name):$(params.image-tag)"

    # 5. Database provisioning (create DB, user, push to Vault)
    - name: db-provision
      taskRef:
        name: db-provision
      runAfter: [build-image]
      when:
        - input: "$(params.pipeline-mode)"
          operator: in
          values: ["full"]
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: COMPONENT_NAME
          value: $(params.component-name)
        - name: VAULT_ADDRESS_PIPELINE
          value: $(params.vault-address-pipeline)
        - name: POSTGRES_HOST
          value: $(params.postgres-host)
        - name: POSTGRES_PORT
          value: $(params.postgres-port)
        - name: INFRA_DB_MOUNT
          value: $(params.infra-db-mount)
        - name: COMPONENT_MOUNT
          value: $(params.component-mount)

    # 6. Database migrations (run Flyway)
    - name: db-migrate
      taskRef:
        name: db-migrate
      runAfter: [db-provision]
      when:
        - input: "$(params.pipeline-mode)"
          operator: in
          values: ["full"]
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: COMPONENT_NAME
          value: $(params.component-name)
        - name: VAULT_ADDRESS_PIPELINE
          value: $(params.vault-address-pipeline)
        - name: POSTGRES_HOST
          value: $(params.postgres-host)
        - name: POSTGRES_PORT
          value: $(params.postgres-port)
        - name: COMPONENT_MOUNT
          value: $(params.component-mount)
        - name: MIGRATIONS_PATH
          value: $(params.migrations-path)

    # 7. Deploy to Kubernetes (skipped in plan mode)
    - name: deploy
      taskRef:
        name: deploy
      runAfter: [db-migrate]
      when:
        - input: "$(params.pipeline-mode)"
          operator: in
          values: ["full"]
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: IMAGE
          value: "$(params.registry-host):$(params.registry-port)/$(params.image-name):$(params.image-tag)"
        - name: IMAGE_NAME
          value: $(params.image-name)
        - name: NAMESPACE
          value: $(params.deployment-namespace)
        - name: DEPLOYMENT_NAME
          value: $(params.deployment-name)
        - name: DEPLOYMENT_PORT
          value: $(params.deployment-port)

  
