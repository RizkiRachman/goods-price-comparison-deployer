# Task: Database Migration using Flyway
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: db-migrate
  namespace: ${PIPELINE_NAMESPACE}
spec:
  workspaces:
    - name: source
  params:
    # These now come from K8s secret created by Terraform
    - name: DB_SECRET_NAME
      type: string
      description: "K8s secret containing database credentials"
      default: "db-credentials"
    - name: DB_URL_KEY
      type: string
      description: "Key in secret for JDBC URL"
      default: "jdbc_url"
    - name: DB_USERNAME_KEY
      type: string
      description: "Key in secret for database username"
      default: "username"
    - name: DB_PASSWORD_KEY
      type: string
      description: "Key in secret for database password"
      default: "password"
    - name: FLYWAY_IMAGE
      type: string
      default: "flyway/flyway:10"
    - name: MIGRATIONS_PATH
      type: string
      default: "src/main/resources/db/migration"
      description: "Path to Flyway migration files"
  steps:
    - name: migrate
      image: $(params.FLYWAY_IMAGE)
      workingDir: $(workspaces.source.path)
      env:
        - name: FLYWAY_URL
          valueFrom:
            secretKeyRef:
              name: $(params.DB_SECRET_NAME)
              key: $(params.DB_URL_KEY)
        - name: FLYWAY_USER
          valueFrom:
            secretKeyRef:
              name: $(params.DB_SECRET_NAME)
              key: $(params.DB_USERNAME_KEY)
        - name: FLYWAY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: $(params.DB_SECRET_NAME)
              key: $(params.DB_PASSWORD_KEY)
      script: |
        #!/bin/bash
        set -e

        echo "🗄️ Running database migrations..."
        echo "   URL: ${FLYWAY_URL}"
        echo "   User: ${FLYWAY_USER}"
        echo "   Migrations: $(params.MIGRATIONS_PATH)"

        # Check if migrations directory exists
        if [ ! -d "$(params.MIGRATIONS_PATH)" ]; then
          echo "⚠️ No migrations directory found at $(params.MIGRATIONS_PATH)"
          echo "   Skipping database migration."
          exit 0
        fi

        # Run Flyway migrate
        flyway \
          -url="${FLYWAY_URL}" \
          -user="${FLYWAY_USER}" \
          -password="${FLYWAY_PASSWORD}" \
          -locations="filesystem:$(params.MIGRATIONS_PATH)" \
          migrate

        echo "✅ Database migration completed successfully!"

    - name: verify
      image: $(params.FLYWAY_IMAGE)
      workingDir: $(workspaces.source.path)
      env:
        - name: FLYWAY_URL
          valueFrom:
            secretKeyRef:
              name: $(params.DB_SECRET_NAME)
              key: $(params.DB_URL_KEY)
        - name: FLYWAY_USER
          valueFrom:
            secretKeyRef:
              name: $(params.DB_SECRET_NAME)
              key: $(params.DB_USERNAME_KEY)
        - name: FLYWAY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: $(params.DB_SECRET_NAME)
              key: $(params.DB_PASSWORD_KEY)
      script: |
        #!/bin/bash
        set -e

        echo "🔍 Verifying migration status..."

        flyway \
          -url="${FLYWAY_URL}" \
          -user="${FLYWAY_USER}" \
          -password="${FLYWAY_PASSWORD}" \
          -locations="filesystem:$(params.MIGRATIONS_PATH)" \
          info
