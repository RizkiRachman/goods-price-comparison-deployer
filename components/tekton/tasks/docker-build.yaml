apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: docker-build
  namespace: ${PIPELINE_NAMESPACE}
spec:
  workspaces:
    - name: output
  params:
    - name: IMAGE
      type: string
      description: "Full image name including registry (e.g., registry.example.com/myimage:tag)"
    - name: DOCKERFILE
      type: string
      default: "./Dockerfile"
    - name: CONTEXT
      type: string
      default: "."
    - name: REGISTRY_MIRROR
      type: string
      default: ""
      description: "Optional local registry mirror to try before Docker Hub"
  steps:
    - name: cleanup-old-image
      image: curlimages/curl:latest
      workingDir: $(workspaces.output.path)
      script: |
        #!/bin/sh
        IMAGE="$(params.IMAGE)"
        REGISTRY="$(echo "$IMAGE" | cut -d'/' -f1)"
        REPO_TAG="$(echo "$IMAGE" | cut -d'/' -f2-)"
        TAG="$(echo "$REPO_TAG" | cut -d':' -f2)"
        REPO="$(echo "$REPO_TAG" | cut -d':' -f1)"

        echo "Cleaning up old image: ${IMAGE}"
        DIGEST=$(curl -sI -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
          "http://${REGISTRY}/v2/${REPO}/manifests/${TAG}" \
          -o /dev/null -w "%{header_json}" 2>/dev/null | \
          tr ',' '\n' | grep -i "docker-content-digest" | cut -d'"' -f4 || true)

        if [ -n "$DIGEST" ]; then
          echo "Deleting old manifest: ${DIGEST}"
          curl -s -X DELETE "http://${REGISTRY}/v2/${REPO}/manifests/${DIGEST}" || echo "Delete failed (may not exist)"
        else
          echo "No existing image found, skipping cleanup"
        fi
    - name: build-and-push
      image: ${KANIKO_IMAGE}
      workingDir: $(workspaces.output.path)
      env:
        - name: DOCKER_CONFIG
          value: /tekton/home/.docker
      command:
        - /kaniko/executor
      args:
        - --dockerfile=$(params.DOCKERFILE)
        - --context=$(params.CONTEXT)
        - --destination=$(params.IMAGE)
        - --skip-tls-verify
        - --insecure
        - --cache=true
