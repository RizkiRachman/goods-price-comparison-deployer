# PipelineRun: Production CI/CD pipeline (external database)
# Triggers: ${DEPLOYMENT_NAME}-pipeline
# Uses DATABASE_HOST/DATABASE_PORT for external database connectivity.
# Falls back to POSTGRES_HOST/POSTGRES_PORT if DATABASE_HOST is not set.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: ${DEPLOYMENT_NAME}-production-
  namespace: ${PIPELINE_NAMESPACE}
spec:
  taskRunTemplate:
    serviceAccountName: ${PIPELINE_SERVICE_ACCOUNT}
  pipelineRef:
    name: ${DEPLOYMENT_NAME}-pipeline
  workspaces:
    - name: shared-workspace
      persistentVolumeClaim:
        claimName: ${DEPLOYMENT_NAME}-pvc
  params:
    - name: git-url
      value: "${GIT_REPO_URL}"
    - name: git-revision
      value: "${GIT_REPO_DEFAULT_BRANCH}"
    - name: image-name
      value: "${IMAGE_NAME}"
    - name: image-tag
      value: "${IMAGE_TAG}"
    - name: registry-host
      value: "${REGISTRY_CLUSTER_HOST}"
    - name: registry-port
      value: "${REGISTRY_CLUSTER_PORT}"
    - name: test-goals
      value: "test"
    - name: deployment-namespace
      value: "${DEPLOYMENT_NAMESPACE}"
    - name: deployment-name
      value: "${DEPLOYMENT_NAME}"
    - name: deployment-port
      value: "${DEPLOYMENT_PORT}"
    - name: deployment-nodeport
      value: "${DEPLOYMENT_NODEPORT}"
    - name: kubectl-image
      value: "${KUBECTL_IMAGE}"
    - name: vault-address-pipeline
      value: "${VAULT_ADDRESS_PIPELINE}"
    - name: component-name
      value: "${COMPONENT_NAME}"
    - name: postgres-host
      value: "${POSTGRES_HOST}"
    - name: postgres-port
      value: "${POSTGRES_PORT}"
    - name: database-host
      value: "${DATABASE_HOST}"
    - name: database-port
      value: "${DATABASE_PORT}"
    - name: infra-db-mount
      value: "${INFRA_DB_MOUNT}"
    - name: component-mount
      value: "${COMPONENT_MOUNT}"
    - name: properties-repo-url
      value: "${PROPERTIES_REPO_URL}"
    - name: properties-repo-default-branch
      value: "${PROPERTIES_REPO_DEFAULT_BRANCH}"
    - name: environment-name
      value: "${ENVIRONMENT_NAME}"
    - name: gravitee-host
      value: "${GRAVITEE_HOST}"
    - name: gravitee-port
      value: "${GRAVITEE_PORT}"
    - name: gravitee-organization
      value: "${GRAVITEE_ORGANIZATION}"
    - name: gravitee-environment
      value: "${GRAVITEE_ENVIRONMENT}"
    - name: gravitee-context-path
      value: "${GRAVITEE_CONTEXT_PATH}"
    - name: gravitee-backend-url
      value: "${GRAVITEE_BACKEND_URL}"
    - name: infra-gravitee-mount
      value: "${INFRA_GRAVITEE_MOUNT}"
    - name: gravitee-version
      value: "${GRAVITEE_VERSION}"
