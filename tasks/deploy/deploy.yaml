# Task: Deploy Application to Kubernetes
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy
  namespace: ${PIPELINE_NAMESPACE}
spec:
  workspaces:
    - name: source
  params:
    - name: PIPELINE_MODE
      type: string
      default: "local"
      description: "Selects image source: 'local' uses IMAGE_LOCAL, 'cloud' uses IMAGE_GHCR"
    - name: IMAGE_LOCAL
      type: string
      default: ""
      description: "Image reference for local mode (local registry)"
    - name: IMAGE_GHCR
      type: string
      default: ""
      description: "Image reference for cloud mode (GHCR)"
    - name: IMAGE_NAME
      type: string
      description: "Container image name (derived from image URI)"
    - name: NAMESPACE
      type: string
      default: "${DEPLOYMENT_NAMESPACE}"
    - name: DEPLOYMENT_NAME
      type: string
      default: "${DEPLOYMENT_NAME}"
    - name: DEPLOYMENT_PORT
      type: string
      default: "${DEPLOYMENT_PORT}"
    - name: DEPLOYMENT_NODEPORT
      type: string
      default: "${DEPLOYMENT_NODEPORT}"
    - name: ROLLOUT_TIMEOUT
      type: string
      default: "300s"
  volumes:
    - name: deployment-template
      configMap:
        name: deployment-template
    - name: service-template
      configMap:
        name: service-template
  steps:
    - name: deploy
      image: ${KUBECTL_IMAGE}
      volumeMounts:
        - name: deployment-template
          mountPath: /var/run/templates/deployment
          readOnly: true
        - name: service-template
          mountPath: /var/run/templates/service
          readOnly: true
      env:
        - name: PIPELINE_MODE
          value: $(params.PIPELINE_MODE)
        - name: IMAGE_LOCAL
          value: $(params.IMAGE_LOCAL)
        - name: IMAGE_GHCR
          value: $(params.IMAGE_GHCR)
        - name: IMAGE_NAME
          value: $(params.IMAGE_NAME)
        - name: NAMESPACE
          value: $(params.NAMESPACE)
        - name: DEPLOYMENT_NAME
          value: $(params.DEPLOYMENT_NAME)
        - name: DEPLOYMENT_PORT
          value: $(params.DEPLOYMENT_PORT)
        - name: DEPLOYMENT_NODEPORT
          value: $(params.DEPLOYMENT_NODEPORT)
      script: |
        #!/bin/bash
        set -e

        # Select image based on pipeline mode
        if [ "$PIPELINE_MODE" = "cloud" ]; then
          IMAGE="$IMAGE_GHCR"
          echo "☁️ Cloud mode: deploying from GHCR"
        else
          IMAGE="$IMAGE_LOCAL"
          echo "🏗️ Local mode: deploying from local registry"
        fi
        echo "🚀 Deploying ${IMAGE} to ${NAMESPACE}"

        cd $(workspaces.source.path)

        # Delete existing deployment to avoid stale containers from merging
        if kubectl get deployment "${DEPLOYMENT_NAME}" -n "${NAMESPACE}" &>/dev/null; then
          echo "🗑️ Deleting existing deployment to ensure clean state..."
          kubectl delete deployment "${DEPLOYMENT_NAME}" -n "${NAMESPACE}" --wait=true
        fi

        # Substitute placeholders in deployment template and apply
        sed -e "s|__DEPLOYMENT_NAME__|${DEPLOYMENT_NAME}|g" \
            -e "s|__IMAGE__|${IMAGE}|g" \
            -e "s|__DEPLOYMENT_PORT__|$(params.DEPLOYMENT_PORT)|g" \
            /var/run/templates/deployment/deployment.yaml > /tmp/deployment.yaml
        kubectl apply -n "${NAMESPACE}" -f /tmp/deployment.yaml

        # Apply (or update) the K8s Service for this deployment
        sed -e "s|__DEPLOYMENT_NAME__|${DEPLOYMENT_NAME}|g" \
            -e "s|__DEPLOYMENT_PORT__|$(params.DEPLOYMENT_PORT)|g" \
            -e "s|__DEPLOYMENT_NODEPORT__|$(params.DEPLOYMENT_NODEPORT)|g" \
            /var/run/templates/service/service.yaml > /tmp/service.yaml
        kubectl apply -n "${NAMESPACE}" -f /tmp/service.yaml
        echo "📡 Service '${DEPLOYMENT_NAME}' applied"

        echo "⏳ Waiting for rollout to complete (timeout: $(params.ROLLOUT_TIMEOUT))..."

        if kubectl rollout status deployment/"${DEPLOYMENT_NAME}" \
          -n "${NAMESPACE}" \
          --timeout=$(params.ROLLOUT_TIMEOUT); then

          echo "✅ Deployment successful!"
          kubectl get deployment "${DEPLOYMENT_NAME}" -n "${NAMESPACE}"
          kubectl get pods -n "${NAMESPACE}" -l app="${DEPLOYMENT_NAME}"
        else
          echo "❌ Rollout failed or timed out"
          kubectl describe deployment "${DEPLOYMENT_NAME}" -n "${NAMESPACE}"
          kubectl get pods -n "${NAMESPACE}" -l app="${DEPLOYMENT_NAME}" -o wide
          exit 1
        fi
