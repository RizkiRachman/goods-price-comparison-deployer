# Pipeline: Clone → Build → Test → Build Image → DB Migrate → Deploy
# Supports pipeline-mode: "full" (all tasks) or "plan" (build+test only, skip image/deploy)
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: goods-price-pipeline
  namespace: ${PIPELINE_NAMESPACE}
spec:
  workspaces:
    - name: shared-workspace
  params:
    - name: git-url
      type: string
      default: "${GIT_REPO_URL}"
    - name: git-revision
      type: string
      default: "${GIT_REPO_DEFAULT_BRANCH}"
    - name: image-name
      type: string
      default: "${IMAGE_NAME}"
    - name: image-tag
      type: string
      default: "${IMAGE_TAG}"
    - name: registry-host
      type: string
      default: "${REGISTRY_CLUSTER_HOST}"
    - name: registry-port
      type: string
      default: "${REGISTRY_CLUSTER_PORT}"
    - name: test-goals
      type: string
      default: "test"
      description: "Maven test goals: 'test' or 'verify'"
    - name: deployment-namespace
      type: string
      default: "${DEPLOYMENT_NAMESPACE}"
    - name: deployment-name
      type: string
      default: "${DEPLOYMENT_NAME}"
    - name: pipeline-mode
      type: string
      default: "full"
      description: "full = all tasks including deploy, plan = build+test only"
    # Database migration parameters
    - name: db-url
      type: string
      default: "${DB_URL}"
      description: "JDBC URL for database migrations"
    - name: db-username
      type: string
      default: "${DB_USERNAME}"
      description: "Database username for migrations"
    - name: db-password-secret
      type: string
      default: "db-credentials"
      description: "K8s secret name containing DB password"
    - name: db-password-key
      type: string
      default: "password"
      description: "Key in secret for DB password"

  tasks:
    # 0. Cleanup workspace
    - name: cleanup
      taskRef:
        name: cleanup
      workspaces:
        - name: output
          workspace: shared-workspace

    # 1. Clone source code
    - name: clone
      taskRef:
        name: git-clone
      runAfter: [cleanup]
      workspaces:
        - name: output
          workspace: shared-workspace
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)

    # 2. Maven build (skip tests)
    - name: build
      taskRef:
        name: maven-build
      runAfter: [clone]
      workspaces:
        - name: output
          workspace: shared-workspace

    # 3. Maven test
    - name: test
      taskRef:
        name: maven-test
      runAfter: [build]
      workspaces:
        - name: output
          workspace: shared-workspace
      params:
        - name: GOALS
          value: $(params.test-goals)

    # 4. Build and push Docker image (skipped in plan mode)
    - name: build-image
      taskRef:
        name: docker-build
      runAfter: [test]
      when:
        - input: "$(params.pipeline-mode)"
          operator: in
          values: ["full"]
      workspaces:
        - name: output
          workspace: shared-workspace
      params:
        - name: IMAGE
          value: "$(params.registry-host):$(params.registry-port)/$(params.image-name):$(params.image-tag)"

    # 5. Database migrations (skipped in plan mode)
    - name: db-migrate
      taskRef:
        name: db-migrate
      runAfter: [build-image]
      when:
        - input: "$(params.pipeline-mode)"
          operator: in
          values: ["full"]
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: DB_URL
          value: $(params.db-url)
        - name: DB_USERNAME
          value: $(params.db-username)
        - name: DB_PASSWORD_SECRET
          value: $(params.db-password-secret)
        - name: DB_PASSWORD_KEY
          value: $(params.db-password-key)

    # 6. Deploy to Kubernetes (skipped in plan mode)
    - name: deploy
      taskRef:
        name: deploy
      runAfter: [db-migrate]
      when:
        - input: "$(params.pipeline-mode)"
          operator: in
          values: ["full"]
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: IMAGE
          value: "$(params.registry-host):$(params.registry-port)/$(params.image-name):$(params.image-tag)"
        - name: IMAGE_NAME
          value: $(params.image-name)
        - name: NAMESPACE
          value: $(params.deployment-namespace)
        - name: DEPLOYMENT_NAME
          value: $(params.deployment-name)
