# RoleBinding: pipeline SA + RBAC_USER → pipeline-role inside PIPELINE_NAMESPACE.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${DEPLOYMENT_NAME}-binding
  namespace: ${PIPELINE_NAMESPACE}
subjects:
- kind: User
  name: ${RBAC_USER}
  apiGroup: rbac.authorization.k8s.io
- kind: ServiceAccount
  name: ${PIPELINE_SERVICE_ACCOUNT}
  namespace: ${PIPELINE_NAMESPACE}
roleRef:
  kind: Role
  name: ${DEPLOYMENT_NAME}-role
  apiGroup: rbac.authorization.k8s.io
